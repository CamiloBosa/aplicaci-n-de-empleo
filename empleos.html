<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Empleos</title>
</head>
<body>
    <header class="barradenavegacion">
        <h1>Empleos</h1>
        <nav>
            <a href="/">Inicio</a>
            <a href="/empleos.html">Empleos</a>
        </nav>
        <div>
            <a href="">Publicar un empleo </a>
            <a href="">Iniciar sesión</a>
        </div>          
    </header>
    <main>
        <section class="primeraseccion">      
            <h1>Encuentra tu próximo trabajo</h1>
            <p> "El trabajo de tus sueños"</p>
            <form class="segundoformulario" role="search">
                <div class="search-main-bar">
                    <input required type="text" placeholder="Buscar empleos">
                    <button type="submit">
                        <svg xmlns="http://w3.org" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="icon-lupa">
                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                        <path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" />
                        <path d="M21 21l-6 -6" />
                        </svg>   
                    </button> 
                </div>
             <div class="search-filters">
                 <select name="technology" id="technology">
                    <option value="Javascript">JavaScript</option>
                    <option value="Python">Python</option>
                    <option value="Javascript">Java</option>
                </select>
                <select name="location" id="location">
                    <option value="">Remoto</option>
                    <option value="Bog">Bogotá</option>
                    <option value="Med">Medellín</option>
                    <option value="Buc">Bucaramanga</option>
                </select> 
                <select name="experience" id="experience">
                    <option value="Junior">Junior</option>
                    <option value="Mid">Mid-level</option>
                    <option value="Senior">Senior</option>
                </select> 
             </div>
            </form>
        </section>
    </main> 
    <footer>
        <small>&copy; 2026 Dev.jobs. Todos los derechos reservados.</small>
    </footer>
</body>
</html>
